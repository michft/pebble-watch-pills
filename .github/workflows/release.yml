name: Release Pebble app

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pebble-app-store-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      REBBLE_APP_ID: 384b30aa3eeb468ba63a4f7e
      REBBLE_ACCESS_TOKEN: ${{ secrets.REBBLE_ACCESS_TOKEN }}

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.5.2
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.18.0
          cache: pnpm

      - name: Read release metadata
        id: release
        run: node scripts/release-metadata.js

      - name: Reject an already released version
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          if git rev-parse --verify --quiet "refs/tags/${RELEASE_TAG}"; then
            echo "${RELEASE_TAG} already exists; bump package.json and CHANGELOG.md." >&2
            exit 1
          fi

      - name: Check deployment settings
        run: |
          if [ -z "${REBBLE_ACCESS_TOKEN}" ]; then
            echo "Set the REBBLE_ACCESS_TOKEN repository secret." >&2
            exit 1
          fi

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install Pebble SDK
        run: |
          python -m pip install uv
          uv tool install pebble-tool
          echo "$(uv tool dir --bin)" >> "${GITHUB_PATH}"
          "$(uv tool dir --bin)/pebble" sdk install latest

      - name: Build PBW
        run: pnpm build

      - name: Verify PBW version
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          PBW_VERSION="$(unzip -p build/pebble-pills.pbw appinfo.json | node -e \
            'let value=""; process.stdin.on("data", chunk => value += chunk); process.stdin.on("end", () => console.log(JSON.parse(value).versionLabel));')"
          if [ "${PBW_VERSION}" != "${RELEASE_VERSION}" ]; then
            echo "PBW version ${PBW_VERSION} does not match package version ${RELEASE_VERSION}." >&2
            exit 1
          fi

      - name: Upload release to Pebble app store
        env:
          RELEASE_NOTES: ${{ steps.release.outputs.notes }}
        run: |
          test -s build/pebble-pills.pbw
          curl --fail-with-body --retry 3 \
            --header "Authorization: Bearer ${REBBLE_ACCESS_TOKEN}" \
            --form-string "release_notes=${RELEASE_NOTES}" \
            --form "pbw=@build/pebble-pills.pbw;type=application/octet-stream" \
            "https://appstore-api.rebble.io/api/dp/app/${REBBLE_APP_ID}/release"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES: ${{ steps.release.outputs.notes }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          gh release create "${RELEASE_TAG}" build/pebble-pills.pbw \
            --target "${GITHUB_SHA}" \
            --title "Pill Reminder ${RELEASE_TAG}" \
            --notes "${RELEASE_NOTES}"
