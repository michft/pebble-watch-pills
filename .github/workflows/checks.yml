name: Pull request checks

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CC: gcc
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Full history and tags: release check compares with the latest v*
          # tag, and whitespace check diffs against the base branch.
          fetch-depth: 0
          persist-credentials: false

      - name: Check whitespace in pull request diff
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git diff --check "origin/${BASE_REF}...HEAD"

      - name: Verify C compiler is GCC
        run: |
          "${CC}" --version
          if "${CC}" -dM -E -x c /dev/null | grep -q '__clang__'; then
            echo "${CC} is Clang; native C harnesses must be checked with GCC." >&2
            exit 1
          fi
          "${CC}" -dM -E -x c /dev/null | grep -q '__GNUC__'

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.5.2
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.18.0
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Require a release-worthy version bump
        run: node scripts/release-metadata.js --require-previous

      - name: Test
        run: pnpm test

      # Host tests compile native code against stub headers; building with the
      # real SDK catches API mismatches before merge instead of at release.
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install Pebble SDK
        env:
          UV_VERSION: 0.13.1
          PEBBLE_TOOL_VERSION: 5.0.40
          PEBBLE_SDK_VERSION: 4.33.1
        run: |
          python -m pip install "uv==${UV_VERSION}"
          uv tool install "pebble-tool==${PEBBLE_TOOL_VERSION}"
          uv tool dir --bin >> "${GITHUB_PATH}"
          "$(uv tool dir --bin)/pebble" sdk install "${PEBBLE_SDK_VERSION}"

      - name: Build PBW
        run: pnpm build
